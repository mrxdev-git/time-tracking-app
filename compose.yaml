services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/data/database.sqlite
    volumes:
      - ./database/data:/app/database/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
